[project]
name = "wonder-stockresearch"
version = "0.1.0"
description = "个人港股、美股公司研究助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "futu-api>=10.11.7108",
    "pydantic>=2,<3",
    "pypdf>=4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[project.scripts]
wonder-research = "wonder_stockresearch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonder_stockresearch"]

[tool.hatch.build.targets.wheel.force-include]
"skills/question-clarification" = "wonder_stockresearch/resources/skills/question-clarification"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
