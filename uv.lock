version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "futu-api" },
    { name = "pydantic" },
    { name = "pypdf" },
    { name = "requests" },
]

[package.optional-dependencies]
observability = [
    { name = "opentelemetry-api" },
    { name = "opentelemetry-exporter-otlp-proto-http" },
    { name = "opentelemetry-sdk" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "futu-api", specifier = ">=10.11.7108" },
    { name = "opentelemetry-api", marker = "extra == 'observability'", specifier = ">=1.28,<2" },
    { name = "opentelemetry-exporter-otlp-proto-http", marker = "extra == 'observability'", specifier = ">=1.28,<2" },
    { name = "opentelemetry-sdk", marker = "extra == 'observability'", specifier = ">=1.28,<2" },
    { name = "pydantic", specifier = ">=2,<3" },
    { name = "pypdf", specifier = ">=4" },
    { name = "requests", specifier = ">=2.34.2" },
]
provides-extras = ["observability"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8,<9" },
    { name = "ruff", specifier = ">=0.8" },
]
